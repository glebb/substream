# Install after DNS and the certificate exist. Keep the existing site intact.
server {
    listen 80;
    listen [::]:80;
    server_name subtitles.example.invalid;
    access_log off;
    # Nginx error messages may contain capability-bearing request URLs.
    error_log /dev/null;
    location /.well-known/acme-challenge/ { root /var/lib/live-subtitle-relay-acme; }
    location / { return 301 https://subtitles.example.invalid$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name subtitles.example.invalid;
    ssl_certificate /etc/letsencrypt/live/subtitles.example.invalid/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/subtitles.example.invalid/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log off;
    error_log /dev/null;
    client_max_body_size 8k;

    location / {
        proxy_pass http://127.0.0.1:8790;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 100s;
        proxy_send_timeout 15s;
    }
}
