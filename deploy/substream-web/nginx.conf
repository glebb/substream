# Include from the existing Nginx http{} context. This file defines only the
# Substream host on ports 80 and 443; the player remains on HTTP for provider
# compatibility while the independent Google-auth portal uses HTTPS.
map $request_uri $substream_bad_encoded_path {
    default 0;
    ~*%(?:2e|2f|5c|25(?:2e|2f|5c)) 1;
    "~*\\\\" 1;
    ~*(?:^|/)\.\.(?:/|\?|$) 1;
}

server {
    listen 80;
    server_name substream.example.invalid;

    # Access URLs carry bearer-like grant tokens. Never put request paths in
    # access or error logs for either protocol.
    access_log off;
    error_log /dev/null crit;

    root /opt/substream-web/current;
    index index.html;
    autoindex off;

    add_header Referrer-Policy "no-referrer" always;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;

    error_page 403 = @substream_denied;

    if ($substream_bad_encoded_path) { return 404; }

    # Certbot's webroot is separate from the static app and its release tree.
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/substream-access-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    # Portal pages and OAuth callbacks always enter through HTTPS. Keep the
    # random-token player paths on HTTP because provider playback requires it.
    location = / { return 301 https://substream.example.invalid/; }
    location = /auth/google/login { return 308 https://substream.example.invalid$request_uri; }
    location = /auth/google/callback { return 308 https://substream.example.invalid$request_uri; }
    location = /access { return 308 https://substream.example.invalid$request_uri; }
    location = /access/revoke { return 308 https://substream.example.invalid$request_uri; }
    location = /logout { return 308 https://substream.example.invalid$request_uri; }
    location = /branding/substream-icon.png { return 308 https://substream.example.invalid$request_uri; }

    location ~* "^/[A-Za-z0-9_-]{43}/(?:api|_substream_authorize|__provider-proxy)(?:/|$)" {
        return 404;
    }

    location ~ "^/[A-Za-z0-9_-]{43}(?<substream_grant_path>/.*)$" {
        limit_except GET HEAD { deny all; }
        auth_request /_substream_authorize;
        rewrite "^/[A-Za-z0-9_-]{43}/$" /index.html break;
        rewrite "^/[A-Za-z0-9_-]{43}/(.*)$" /$1 break;
        try_files $uri =404;
    }

    # Nginx creates this internal GET. Do not pass browser credentials, body,
    # or caller-supplied proxy identity headers to the private authorizer.
    location = /_substream_authorize {
        internal;
        proxy_pass http://127.0.0.1:8791/authorize;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_set_header X-Substream-Original-URI $request_uri;
        proxy_set_header X-Substream-Client-IP $remote_addr;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Real-IP "";
        proxy_set_header Host 127.0.0.1;
        proxy_connect_timeout 2s;
        proxy_read_timeout 3s;
    }

    location @substream_denied {
        types { }
        default_type text/html;
        return 403 '<!doctype html><meta charset="utf-8"><title>Access unavailable</title><p>This Substream link is unavailable. Return to <a href="https://substream.example.invalid/">the Substream access page</a>.</p>';
    }

    # Fixed public XMLTV bridge. Never forward caller headers, bodies or URLs.
    # Packaged TVs request the publisher directly; browsers need same-origin CORS.
    location = /public/nordic-epg {
        limit_except GET HEAD { deny all; }
        if ($args != "") { return 400; }
        proxy_pass https://epgshare01.online/epgshare01/epg_ripper_SE1.xml.gz;
        proxy_ssl_server_name on;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_pass_request_headers off;
        proxy_pass_request_body off;
        proxy_set_header Host epgshare01.online;
        proxy_set_header Content-Length "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 20s;
        proxy_hide_header Set-Cookie;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=300";
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / { return 404; }
}

server {
    listen 443 ssl;
    server_name substream.example.invalid;

    ssl_certificate /etc/letsencrypt/live/substream.example.invalid/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/substream.example.invalid/privkey.pem;

    # Never log paths or queries on this host: OAuth state and access actions
    # can appear in URLs. No HSTS or upgrade-insecure-requests is emitted.
    access_log off;
    error_log /dev/null crit;

    add_header Referrer-Policy "same-origin" always;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;

    if ($substream_bad_encoded_path) { return 404; }

    # The standalone service owns Google sign-in, session cookies, CSRF and
    # access-link creation/revocation. Only these exact routes are reachable.
    location = / {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:8792;
    }
    location = /auth/google/login {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:8792;
    }
    location = /auth/google/callback {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:8792;
    }
    location = /access {
        limit_except POST { deny all; }
        proxy_pass http://127.0.0.1:8792;
    }
    location = /access/revoke {
        limit_except POST { deny all; }
        proxy_pass http://127.0.0.1:8792;
    }
    location = /logout {
        limit_except POST { deny all; }
        proxy_pass http://127.0.0.1:8792;
    }
    location = /branding/substream-icon.png {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:8792;
    }

    # Browsers may upgrade an explicit HTTP player link to HTTPS. Send only
    # player landing links back to HTTP; the HTTP gate still checks the grant.
    location ~ "^/[A-Za-z0-9_-]{43}/$" {
        if ($request_method !~ "^(GET|HEAD)$") { return 403; }
        add_header Referrer-Policy "no-referrer" always;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        return 302 http://substream.example.invalid$uri;
    }

    # These proxy headers are set from Nginx's observed peer address, replacing
    # any values a remote caller supplied. The service trusts this listener.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_connect_timeout 2s;
    proxy_read_timeout 10s;

    # Fixed public XMLTV bridge. Never forward caller headers, bodies or URLs.
    # Packaged TVs request the publisher directly; browsers need same-origin CORS.
    location = /public/nordic-epg {
        limit_except GET HEAD { deny all; }
        if ($args != "") { return 400; }
        proxy_pass https://epgshare01.online/epgshare01/epg_ripper_SE1.xml.gz;
        proxy_ssl_server_name on;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_pass_request_headers off;
        proxy_pass_request_body off;
        proxy_set_header Host epgshare01.online;
        proxy_set_header Content-Length "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 20s;
        proxy_hide_header Set-Cookie;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=300";
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / { return 404; }
}
